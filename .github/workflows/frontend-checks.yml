name: THE HAVEN - Frontend Quality Check

on:
  push:
    branches: [main]
    paths:
      - 'the-haven-webapp/frontend/**'
      - 'the-haven-webapp/backend/src/server.js'
      - 'the-haven-webapp/backend/src/smoke-api.js'
      - '.github/workflows/frontend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout THE HAVEN
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend and backend JavaScript
        run: |
          node --check the-haven-webapp/frontend/app.js
          node --check the-haven-webapp/frontend/config.js
          node --check the-haven-webapp/backend/src/server.js
          node --check the-haven-webapp/backend/src/smoke-api.js
      - name: Verify Vercel-to-Render production API routing
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const dir = 'the-haven-webapp/frontend/';
          const cfg = fs.readFileSync(dir + 'config.js', 'utf8');
          const routes = JSON.parse(fs.readFileSync(dir + 'vercel.json', 'utf8'));
          assert.match(cfg, /DEMO_MODE:\s*false/, 'Production must not use demo accounts');
          assert.match(cfg, /API_BASE_URL:\s*'\/api'/, 'API must be a same-origin /api path');
          assert.equal(routes.outputDirectory, '.');
          assert.ok(routes.rewrites.some(x =>
            x.source === '/api/:path*' &&
            x.destination === 'https://the-haven-backend.onrender.com/api/:path*'
          ), 'Proxy must forward /api requests to THE HAVEN Render backend');
          console.log('Production config and Vercel external API rewrite valid.');
          NODE
      - name: Guard mobile layout breakpoints and overflow behavior
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const css = fs.readFileSync('the-haven-webapp/frontend/styles.css', 'utf8');
          const html = fs.readFileSync('the-haven-webapp/frontend/index.html', 'utf8');
          assert.match(html, /name="viewport"[^>]*width=device-width/, 'Mobile viewport meta required');
          assert.match(css, /@media\(max-width:900px\)/, 'Small-tablet sidebar collapse required');
          assert.match(css, /\.sidebar\.open\s*\{transform:translateX\(0\)\}/, 'Sidebar should reopen');
          assert.match(css, /\.overlay\.open\s*\{/, 'Off-canvas navigation requires backdrop');
          assert.match(css, /\.topbar>div:first-child\s*\{flex:1 1 auto;min-width:0\}/, 'Top bar must shrink on small screens');
          assert.match(css, /\.public-nav\s*\{\s*display:grid;\s*grid-template-columns:repeat\(3,minmax\(0,1fr\)\)/, 'Phone navigation must use non-overlapping columns');
          assert.match(css, /\.table-wrap\s*\{[\s\S]*?overflow-x:auto/, 'Tables must scroll within their wrapper');
          assert.match(css, /\.modal-footer\s*\{[\s\S]*?bottom:0/, 'Modal buttons must stay visible');
          assert.match(css, /@media\(max-width:359px\)/, 'Narrow phones need a dedicated breakpoint');
          assert.match(css, /@media\(max-width:800px\)\s*\{[\s\S]*?\.public-hero\.hero-simple \.hero-actions\s*\{\s*display:grid;\s*grid-template-columns:minmax\(0,1fr\);/, 'Hero mobile actions must stack in one full-width column');
          assert.match(css, /\.public-hero\.hero-simple \.hero-actions \.button\s*\{[^}]*white-space:normal;[^}]*overflow-wrap:break-word;/, 'Hero button labels must wrap within their own bounds instead of overlapping');
          assert.match(css, /\.public-hero\.hero-simple \.public-art\s*\{[^}]*margin:10px auto 0;/, 'Hero illustration must sit below mobile text');
          assert.ok(html.includes('styles.css?v=20261026-aligned-registration-actions'), 'Updated CSS must bypass stale browser cache');
          assert.match(html, /class="splash-emblem"/, 'Splash logo must have a shared emblem container');
          assert.match(html, /class="splash-ring splash-ring-outer"/, 'Outer splash ring missing');
          assert.match(html, /class="splash-ring splash-ring-inner"/, 'Inner splash ring missing');
          assert.ok(css.includes('.splash-emblem .splash-ring{'), 'Decorative splash rings must use emblem positioning');
          assert.match(css, /top:50%;\s*left:50%;\s*border-radius:50%;\s*transform:translate\(-50%,-50%\);/, 'Splash circles must share the logo center');
          assert.ok(css.includes('.splash::before,.splash::after{content:none}'), 'Offset screen-level splash rings must be disabled');
          assert.equal((css.match(/\{/g)||[]).length,(css.match(/\}/g)||[]).length,'CSS block braces must balance');
          console.log('THE HAVEN phone/tablet responsive layout checks passed.');
          NODE
      - name: Verify essential UI elements
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base = 'the-haven-webapp/frontend/';
          const html = fs.readFileSync(base + 'index.html', 'utf8');
          const css = fs.readFileSync(base + 'styles.css', 'utf8');
          const app = fs.readFileSync(base + 'app.js', 'utf8');
          assert.match(html, /id="splash"/, 'Splash screen is required');
          assert.match(html, /data-action="skip-content"/, 'Keyboard skip control is required');
          assert.match(css, /@keyframes havenPulse/, 'Logo pulse animation is required');
          assert.match(css, /\.club-progress/, 'Club capacity indicator is required');
          assert.match(app, /modalReturnFocus/, 'Dialog focus restoration is required');
          assert.match(app, /toggle-password/, 'Password visibility control is required');
          assert.match(app, /const passwordEyeIcon = '<svg /, 'Password must use the eye SVG');
          assert.match(app, /const passwordEyeOffIcon = '<svg /, 'Visible password must use the eye-off SVG');
          assert.ok(app.includes('node.innerHTML=reveal?passwordEyeOffIcon:passwordEyeIcon'), 'Button click must change the eye icon');
          assert.ok(app.includes('aria-controls="f-${name}"'), 'Eye icon should reference the password input');
          assert.ok(html.includes('app.js?v=20261026-aligned-registration-actions'), 'Browser must fetch new password eye JavaScript');
          assert.ok(app.includes("node.setAttribute('aria-label',reveal?'Hide password':'Show password')"), 'Eye icon button must remain accessible');
          assert.ok(css.includes('.password-toggle svg{display:block;width:22px;height:22px;pointer-events:none}'), 'Icon must be centered inside the button');
          assert.ok(css.includes('.password-field .input{padding-right:59px}'), 'Input must reserve space for the eye icon');
          assert.match(app, /id="main-content"/, 'Main content landmark is required');
          assert.doesNotMatch(app, /class="(?:nav-icon|stat-icon|empty-icon|club-art-symbol|activity-marker|next-step-icon|search-symbol)"/, 'Decorative icons must be removed across both roles');
          assert.doesNotMatch(app, /class="avatar(?: sm)?"/, 'Decorative avatar badges should not render');
          assert.ok(app.includes("['notifications','Notifications']"), 'Admin notifications must remain accessible as text in navigation');
          assert.ok(app.includes('>Menu</button>'), 'Mobile menu button must be text-only');
          assert.ok(app.includes('class="password-toggle"'), 'Keep essential password eye toggle');
          assert.ok(css.includes('.hero-facts span::before{content:none;display:none}'), 'Landing checklist marks must be hidden');
          assert.ok(html.includes('styles.css?v=20261026-aligned-registration-actions') && html.includes('app.js?v=20261026-aligned-registration-actions'), 'Mobile browsers must fetch fresh assets');
          assert.match(html, /id="haven-loading"/, 'Global loading overlay must be available on all pages');
          assert.match(html, /id="haven-loading-message"/, 'Global loading status label must be accessible');
          assert.ok(app.includes('const activeLoaders=new Map()'), 'Concurrent operations must share a reference-counted loader');
          assert.ok(app.includes('const endLoading=beginLoading(loadingMessage(method,path),1)'), 'Every API request must show loading');
          assert.ok(app.includes('endLoading();'), 'All request paths must release the loader');
          assert.ok(app.includes("beginLoading('Loading community data...',2)"), 'Page data refresh must show loading until completion');
          assert.ok(app.includes('form.dataset.submitting'), 'Modal submits must reject double clicks');
          assert.ok(app.includes('class="haven-inline-spinner"'), 'Modal Save and Login buttons must display spinners');
          assert.ok(app.includes('btn.setAttribute(\'aria-busy\',\'true\')'), 'Submitting state must be accessible');
          assert.ok(css.includes('.haven-loading[hidden]{display:none!important}'), 'Hidden state must override overlay display');
          assert.ok(css.includes('@keyframes havenLoadingSpin'), 'Visible spinner must animate');
          assert.ok(css.includes('@media(prefers-reduced-motion:reduce)'), 'Reduced motion users must be supported');
          assert.ok(app.includes('async function checkApprovalStatus()'), 'Check Status needs a dedicated live request');
          assert.ok(app.includes("const latest=await get('/me')"), 'Current status must be fetched from /me');
          assert.ok(app.includes("if(type==='check-approval'){await checkApprovalStatus();return;}"), 'Button must use live status refresh');
          assert.ok(app.includes("nav('dashboard');"), 'Approved accounts must reach the dashboard');
          assert.ok(app.includes("state.approvalFeedback='Status checked: Still pending."), 'Pending users must see an explicit result');
          assert.ok(app.includes("state.approvalFeedback='Status checked: Registration rejected."), 'Rejected users must see an explicit result');
          assert.ok(app.includes('role="status" aria-live="polite"'), 'Status feedback must be accessible');
          assert.ok(app.includes('disabled aria-busy="true"'), 'Repeated status checks must be blocked');
          assert.ok(app.includes("cache:'no-store'"), 'Avoid stale account status in the browser');
          assert.ok(css.includes('.approval-check-feedback{'), 'Status messaging must have responsive styles');
          const api = fs.readFileSync('the-haven-webapp/backend/src/server.js', 'utf8');
          assert.ok(api.includes("app.delete('/api/users/:id', auth, onlyAdmin"), 'Delete student endpoint requires admin role');
          assert.ok(api.includes("User.findOne({_id:targetId,role:'student'}).session(session)"), 'Cannot delete admin accounts');
          assert.ok(api.includes("You cannot delete your own administrator account."), 'Protect administrator against self deletion');
          assert.ok(api.includes("req.body?.confirmation!=='DELETE'"), 'Require typed permanent deletion confirmation');
          assert.ok(api.includes("student.email!==expectedEmail"), 'Revalidate selected student email on backend');
          assert.ok(api.includes('session.withTransaction(async()=>'), 'Student and dependent records must be cleaned atomically');
          assert.ok(api.includes("Membership.find({studentId:student._id,status:'active'})"), 'Club counts use active memberships');
          assert.ok(api.includes('memberCount:{$max:[0,{$subtract:'), 'Removal cannot make club member count negative');
          for (const model of ['Application','Membership','ClubStaff','Notification','Announcement']) {
            assert.ok(api.includes(model + '.deleteMany('), model + ' records must be cleaned');
          }
          assert.ok(app.includes("const deleteAction=u.role==='student'"), 'Students of every approval status can be deleted');
          assert.ok(app.includes('data-action="delete-user"'), 'User Management needs a Delete User button');
          assert.ok(app.includes("if(data.confirmDelete!=='DELETE')"), 'Delete confirmation must be checked before request');
          assert.ok(app.includes("await mutation('DELETE',`/users/${userId}`"), 'Frontend must call backend delete endpoint');
          assert.ok(css.includes('.delete-user-warning{'), 'Permanent deletion needs a clear warning');
          assert.ok(app.includes('class="table-action user-management-actions"'), 'User Management action cells must have a dedicated alignment class');
          assert.ok(app.includes('class="table-action registration-request-actions"'), 'Registration Requests must have an aligned action column');
          assert.match(css, /\.registration-request-actions\s*\{[\s\S]*?grid-template-columns:minmax\(0,1fr\);/, 'Approve and Reject actions must be one column');
          assert.match(css, /\.registration-request-actions \.button\s*\{[\s\S]*?width:100%;\s*min-width:0;\s*min-height:44px;/, 'Approve and Reject must use identical button widths and heights');
          assert.ok(css.includes('.registration-request-actions{width:150px;min-width:150px;gap:8px}'), 'Registration buttons must be consistently sized for mobile');
          assert.ok(app.includes('data-action="approve-user"') && app.includes('data-action="reject-user"'), 'Registration approval actions must stay interactive');
          assert.match(css, /\.user-management-actions,\s*\.registration-request-actions\s*\{\s*display:grid;/, 'User and Registration buttons must stack consistently');
          assert.ok(css.includes('grid-template-columns:minmax(0,1fr);'), 'Button column must remain single-width');
          assert.match(css, /\.user-management-actions \.button,\s*\.registration-request-actions \.button\s*\{\s*display:flex;/, 'Button centering must apply to both account tables');
          assert.match(css, /width:100%;\s*min-width:0;\s*min-height:44px;/, 'Review and Delete buttons must share their dimensions');
          assert.match(css, /\.user-management-actions,\s*\.registration-request-actions\{width:150px;min-width:150px;gap:8px\}/, 'Mobile buttons need consistent widths');
          const smoke = fs.readFileSync('the-haven-webapp/backend/src/smoke-api.js', 'utf8');
          assert.ok(smoke.includes('Guest cannot permanently delete a student'), 'Guests must never delete users');
          assert.ok(smoke.includes('Administrator can never delete own account'), 'Never delete administrator in smoke tests');
          assert.ok(smoke.includes('Account deletion requires explicit typed confirmation'), 'Reject unconfirmed deletion');
          console.log('THE HAVEN UI checks passed. No deployment occurred.');
          NODE
