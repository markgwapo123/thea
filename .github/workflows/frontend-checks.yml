name: THE HAVEN - Frontend Quality Check

on:
  push:
    branches: [main]
    paths:
      - 'the-haven-webapp/frontend/**'
      - '.github/workflows/frontend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout THE HAVEN
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend JavaScript
        run: |
          node --check the-haven-webapp/frontend/app.js
          node --check the-haven-webapp/frontend/config.js
      - name: Verify Vercel-to-Render production API routing
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const dir = 'the-haven-webapp/frontend/';
          const cfg = fs.readFileSync(dir + 'config.js', 'utf8');
          const routes = JSON.parse(fs.readFileSync(dir + 'vercel.json', 'utf8'));
          assert.match(cfg, /DEMO_MODE:\s*false/, 'Production must not use demo accounts');
          assert.match(cfg, /API_BASE_URL:\s*'\/api'/, 'API must be a same-origin /api path');
          assert.equal(routes.outputDirectory, '.');
          assert.ok(routes.rewrites.some(x =>
            x.source === '/api/:path*' &&
            x.destination === 'https://the-haven-backend.onrender.com/api/:path*'
          ), 'Proxy must forward /api requests to THE HAVEN Render backend');
          console.log('Production config and Vercel external API rewrite valid.');
          NODE
      - name: Guard mobile layout breakpoints and overflow behavior
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const css = fs.readFileSync('the-haven-webapp/frontend/styles.css', 'utf8');
          const html = fs.readFileSync('the-haven-webapp/frontend/index.html', 'utf8');
          assert.match(html, /name="viewport"[^>]*width=device-width/, 'Mobile viewport meta required');
          assert.match(css, /@media\(max-width:900px\)/, 'Small-tablet sidebar collapse required');
          assert.match(css, /\.sidebar\.open\s*\{transform:translateX\(0\)\}/, 'Sidebar should reopen');
          assert.match(css, /\.overlay\.open\s*\{/, 'Off-canvas navigation requires backdrop');
          assert.match(css, /\.topbar>div:first-child\s*\{flex:1 1 auto;min-width:0\}/, 'Top bar must shrink on small screens');
          assert.match(css, /\.public-nav\s*\{\s*display:grid;\s*grid-template-columns:repeat\(3,minmax\(0,1fr\)\)/, 'Phone navigation must use non-overlapping columns');
          assert.match(css, /\.table-wrap\s*\{[\s\S]*?overflow-x:auto/, 'Tables must scroll within their wrapper');
          assert.match(css, /\.modal-footer\s*\{[\s\S]*?bottom:0/, 'Modal buttons must stay visible');
          assert.match(css, /@media\(max-width:359px\)/, 'Narrow phones need a dedicated breakpoint');
          assert.equal((css.match(/\{/g)||[]).length,(css.match(/\}/g)||[]).length,'CSS block braces must balance');
          console.log('THE HAVEN phone/tablet responsive layout checks passed.');
          NODE
      - name: Verify essential UI elements
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base = 'the-haven-webapp/frontend/';
          const html = fs.readFileSync(base + 'index.html', 'utf8');
          const css = fs.readFileSync(base + 'styles.css', 'utf8');
          const app = fs.readFileSync(base + 'app.js', 'utf8');
          assert.match(html, /id="splash"/, 'Splash screen is required');
          assert.match(html, /data-action="skip-content"/, 'Keyboard skip control is required');
          assert.match(css, /@keyframes havenPulse/, 'Logo pulse animation is required');
          assert.match(css, /\.club-progress/, 'Club capacity indicator is required');
          assert.match(app, /modalReturnFocus/, 'Dialog focus restoration is required');
          assert.match(app, /toggle-password/, 'Password visibility control is required');
          assert.match(app, /id="main-content"/, 'Main content landmark is required');
          console.log('THE HAVEN UI checks passed. No deployment occurred.');
          NODE
