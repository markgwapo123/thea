name: THE HAVEN - Reset Existing Admin Password

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RESET to change the password for the existing ADMIN_EMAIL account'
        required: true
        type: string

permissions:
  contents: read

# Do not overlap password resets and initial admin bootstrap operations.
concurrency:
  group: the-haven-initial-admin
  cancel-in-progress: false

jobs:
  reset-admin-password:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: the-haven-webapp/backend
    steps:
      - name: Checkout THE HAVEN
        uses: actions/checkout@v4

      - name: Confirm intentional password reset
        env:
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "RESET" ]; then
            echo "::error::Enter RESET in the confirmation field to authorize this operation."
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate private secrets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$MONGODB_URI" ] || [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::MONGODB_URI, ADMIN_EMAIL and ADMIN_PASSWORD repository secrets are required."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate reset script syntax
        run: node --check src/reset-admin-password.js

      - name: Reset existing administrator password
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: the_haven_db
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node src/reset-admin-password.js
